<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — TiniBuds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; padding-top: 5rem; }
    .error-main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.5rem; }
    .error-inner { max-width: 36ch; }
    .error-code { font-family: var(--font-display); font-weight: 800; font-size: clamp(4rem, 15vw, 8rem); line-height: 1; letter-spacing: -0.04em; color: var(--accent); margin: 0 0 0.5rem; }
    .error-title { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin: 0 0 0.75rem; }
    .error-text { color: var(--text-muted); margin: 0 0 1.5rem; }
  </style>
</head>
<body>
  <header class="header scrolled">
    <div class="container header-inner">
      <a href="/" class="logo">TiniBuds</a>
      <nav class="nav">
        <a href="/#what-we-do">What we do</a>
        <a href="/#why-us">Why us</a>
        <a href="/#contact">Contact</a>
      </nav>
      <button class="menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="error-page">
    <section class="error-main">
      <div class="error-inner">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 class="error-title">Page not found</h1>
        <p class="error-text">This page doesn’t exist or has been moved. Head back to the homepage.</p>
        <a href="/" class="btn btn-primary">Back to home</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-brand">TiniBuds</p>
      <p class="footer-domain"><a href="https://tinibuds.store">tinibuds.store</a></p>
      <p class="footer-copy">Apps for education.</p>
    </div>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
